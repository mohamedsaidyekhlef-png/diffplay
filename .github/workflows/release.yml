name: release
# Tags every new package.json version on main (v0.1.0) and moves the major tag (v0)
# so `uses: mohamedsaidyekhlef-png/diffplay@v0` always points at the latest release.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm test
      - name: Tag the release
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          MAJOR="${VERSION%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$VERSION" >/dev/null 2>&1 && git merge-base --is-ancestor "$VERSION^{commit}" HEAD; then
            echo "$VERSION already tagged"
          else
            # New version, or the tagged commit is no longer on main (history was rewritten).
            git tag -fa "$VERSION" -m "$VERSION"
            git push -f origin "$VERSION"
          fi
          git tag -fa "$MAJOR" -m "$MAJOR (latest: $VERSION)"
          git push -f origin "$MAJOR"
      - name: Re-point tags orphaned by a history rewrite
        run: |
          # A tag whose commit is no longer on main is moved to the main commit with the same subject line.
          git fetch -q --tags --force origin
          for TAG in $(git tag); do
            SHA=$(git rev-parse "$TAG^{commit}")
            git merge-base --is-ancestor "$SHA" HEAD && continue
            SUBJECT=$(git log -1 --format=%s "$SHA")
            MATCH=$(git log --format='%H %s' HEAD | awk -v s="$SUBJECT" '{h=$1; $1=""; sub(/^ /,""); if ($0==s) {print h; exit}}')
            if [ -n "$MATCH" ]; then
              git tag -fa "$TAG" "$MATCH" -m "$TAG"
              git push -f origin "$TAG"
              echo "Re-pointed $TAG to $MATCH"
            else
              echo "::warning::No matching commit on main for tag $TAG"
            fi
          done
